<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .grid-container {
      display: grid;
      width: 748px;
      height: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px; /* set the last row to 22px to make sure dont have gap at the bottom */
      gap: 9px;
      background-color: #000; /* Gap Colour */
    }
    .red {
      background-color: #E72F24;
      grid-area: 1 / 1 / 2 / 2;
    }
    .white {
      background-color: #F0F1EC;
    }
    .white.one {
      grid-column: span 3;
    }
    .white.second {
      grid-row: span 2;
    }
    .white.third {
      grid-column: span 2;;
      grid-row: span 2;
    }
    .white.fourth {
      grid-column-start: 4;
      grid-row: 3 / span 2;
    }
    .white.fifth {
      grid-column-start: 1;
    }

    .black {
      background-color: #232629;
    }
    .blue {
      background-color: #004592;
      border-bottom: 10px solid #000;
    }
    .yellow {
      background-color: #F9D01E;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="grid-container">
     <div class="red"></div>
     <div class="white one"></div>
     <div class="white second"></div>
     <div class="white third"></div>
     <div class="white fourth"></div>
     <div class="blue"></div>
     <div class="white fifth"></div>
     <div class="yellow"></div>
     <div class="black"></div>
   </div>
</body>

</html>
