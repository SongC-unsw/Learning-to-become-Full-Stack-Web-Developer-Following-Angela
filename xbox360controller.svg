<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
    <!-- 手柄主体 -->
    <path d="M50,150 Q150,50 350,50 Q450,50 450,150 Q450,250 350,250 Q150,250 50,150 Z" fill="#c0c0c0" stroke="#000" stroke-width="5"/>
    <!-- 左侧摇杆 -->
    <circle cx="150" cy="150" r="20" fill="#000"/>
    <!-- 右侧摇杆 -->
    <circle cx="350" cy="150" r="20" fill="#000"/>
    <!-- D-Pad -->
    <rect x="90" y="140" width="20" height="40" fill="#000"/>
    <rect x="70" y="160" width="60" height="20" fill="#000"/>
    <!-- 按钮 A, B, X, Y -->
    <circle cx="300" cy="100" r="15" fill="green"/>
    <circle cx="330" cy="140" r="15" fill="red"/>
    <circle cx="270" cy="140" r="15" fill="blue"/>
    <circle cx="300" cy="180" r="15" fill="yellow"/>
</svg>
